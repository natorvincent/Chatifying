[build]
  publish = "dist"  # Vite's default output directory is "dist", not "build"
  command = "cp secrets.example.toml secrets.toml && CI=false npm run build"  # Create secrets.toml before build

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

