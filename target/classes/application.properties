spring.application.name=backend

# MySQL Datasource Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/chatify?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Basic Security Config
spring.security.user.name=admin
spring.security.user.password=admin

# CORS configurationS
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=*
spring.mvc.cors.allowed-headers=*

# Expose actuator endpoints if needed
management.endpoints.web.exposure.include=*

# Add these lines to support file uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configure static resource handling for avatar images
spring.web.resources.static-locations=classpath:/static/,file:uploads/
spring.mvc.static-path-pattern=/static/**
